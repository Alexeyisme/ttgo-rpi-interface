; PlatformIO Project Configuration File
;
; TTGO T-Display — Hermes Satellite Display
;
; Multi-mode display: RPi stats, Spotify, Weather, Webcam image.
; Button1 cycles modes. Button2 = push-to-talk (hold to record voice).
;
; Board: LilyGo T-Display (ESP32 + ST7789 135x240 TFT)
; Serial port: /dev/ttyACM0 (USB-C to RPi)

[platformio]
default_envs = lilygo-t-display

[env:lilygo-t-display]
platform = espressif32@6.5.0
board = lilygo-t-display
framework = arduino
board_build.partitions = huge_app.csv
monitor_speed = 115200
upload_port = /dev/ttyACM0
monitor_port = /dev/ttyACM0
upload_speed = 921600

build_flags =
    -Os
    -DCORE_DEBUG_LEVEL=0
    -DNDEBUG
    ; TFT_eSPI setup — LilyGo T-Display ST7789 135x240
    -DUSER_SETUP_LOADED=1
    -DST7789_DRIVER=1
    -DTFT_SDA_READ=1
    -DTFT_WIDTH=135
    -DTFT_HEIGHT=240
    -DCGRAM_OFFSET=1
    -DTFT_MOSI=19
    -DTFT_SCLK=18
    -DTFT_CS=5
    -DTFT_DC=16
    -DTFT_RST=23
    -DTFT_BL=4
    -DTFT_BACKLIGHT_ON=1
    -DLOAD_GLCD=1
    -DLOAD_FONT2=1
    -DLOAD_FONT4=1
    -DLOAD_FONT6=1
    -DLOAD_FONT7=1
    -DLOAD_FONT8=1
    -DLOAD_GFXFF=1
    -DSMOOTH_FONT=1
    -DSPI_FREQUENCY=40000000
    -DSPI_READ_FREQUENCY=6000000

lib_deps =
    bodmer/TFT_eSPI@^2.5.43
    bblanchon/ArduinoJson@^7.0.3
    bitbank2/JPEGDEC@^1.8.4

[env:test]
platform = espressif32@6.5.0
board = lilygo-t-display
framework = arduino
build_flags =
    -DTEST_MODE=1
    -DUNITY_INCLUDE_CONFIG_H
lib_deps =
    throwtheswitch/Unity@^2.5.2
    bblanchon/ArduinoJson@^7.0.3
test_framework = unity
test_filter = *
test_build_src = no
